name: Source-only repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I tools/check_repo.py --revision HEAD
      - run: python -B -m unittest discover -s tests -p test_repo_hygiene.py
